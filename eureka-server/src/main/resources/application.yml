server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # сервер не регистрирует сам себя и не тянет реестр
    register-with-eureka: false
    fetch-registry: false
  server:
    # в песочнице/на демо клиенты регистрируются и забираются быстрее
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n"
