server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    loadbalancer:
      cache:
        # короткий TTL: новые инстансы Hotel Service подхватываются почти сразу
        ttl: 2s

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

security:
  jwt:
    # base64-секрет HS256
    secret: ${JWT_SECRET:aG90ZWwtcGxhdGZvcm0tand0LXNlY3JldC1rZXktMDEyMzQ1Njc4OWFiY2RlZg==}
    issuer: booking-service
    ttl-minutes: 60          # срок действия токена

app:
  hotel-client:
    # имя сервиса резолвится через Eureka + LoadBalancerClient
    base-url: http://hotel-service
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
    max-attempts: 3          # ограниченное число повторов
    backoff-initial-ms: 200  # с увеличением интервала между попытками
    backoff-multiplier: 2.0
    backoff-max-ms: 2000
  saga:
    pending-timeout-seconds: 120
    sweeper-interval-ms: 30000

resilience4j:
  circuitbreaker:
    instances:
      hotelService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId}] %logger{24} - %msg%n"
