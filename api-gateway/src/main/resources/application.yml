server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # --- Booking Service: бронирования, пользователи, регистрация/авторизация ---
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/users/**
            # --- Hotel Management Service: отели, номера, статистика ---
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**,/api/statistics/**
    loadbalancer:
      cache:
        # короткий TTL: на живом стенде новые инстансы подхватываются почти сразу
        ttl: 2s

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId}] %logger{20} - %msg%n"
